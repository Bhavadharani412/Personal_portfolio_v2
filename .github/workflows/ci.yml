name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, deploy-prep ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    name: Validate, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check & Lint
        run: npm run lint

      - name: Validate Markdown Content & Source-of-Truth Sync
        run: npm run validate-content

      - name: Run Unit & API Tests
        run: npm test

      - name: Run Chatbot Knowledge Evaluation (Offline Retrieval Check)
        run: npm run eval-chatbot -- --offline

      - name: Build Production Application
        run: npm run build

  deploy-worker:
    name: Deploy Cloudflare Worker
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets[format('{0}', 'CLOUDFLARE_API_TOKEN')] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets[format('{0}', 'CLOUDFLARE_ACCOUNT_ID')] }}
      PRODUCTION_API_URL: ${{ vars[format('{0}', 'PRODUCTION_API_URL')] }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      - name: Apply D1 Production Migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply DB --remote --env=""

      - name: Deploy Cloudflare Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --env="" --var BUILD_SHA:${{ github.sha }}

      - name: Run Post-Deploy Smoke Check
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run smoke -- "${PRODUCTION_API_URL:-https://api.bhavadharani.me}" https://bhavadharani.me
