name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check & Lint
        run: npm run lint

      - name: Validate Markdown Content & Metadata
        run: npm run validate-content

      - name: Run Unit & API Tests
        run: npm test

      - name: Run Chatbot Knowledge Evaluation
        run: npm run eval-chatbot

      - name: Build Production Application
        run: npm run build
